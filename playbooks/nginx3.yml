---
- name: Setup Web Server
  hosts: all
  gather_facts: false

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        update_cache: yes
        state: present

    - name: Render index.html template from index3.html.j2
      template:
        src: index3.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644

    - name: See
      debug:
        msg: "See: http://{{ ansible_host }}"
