---
- name: Setup Web Server
  hosts: all

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        update_cache: yes
        state: present

    - name: Render index.html template from index-facts.html.j2
      template:
        src: index-facts.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644

    - name: See
      debug:
        msg: "See: http://{{ ansible_host }} or http://{{ ansible_facts.eth0.ipv4.address }}"
