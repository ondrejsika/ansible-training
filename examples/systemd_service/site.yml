---
- name: Install and configure hello-world-server with systemd
  hosts: all

  tasks:
    - name: Install hello-world-server using slu
      ansible.builtin.command:
        cmd: slu install-bin hello-world-server
        creates: /usr/local/bin/hello-world-server

    - name: Create systemd service file
      ansible.builtin.template:
        src: hello-world-server.service.j2
        dest: /etc/systemd/system/hello-world-server.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart hello-world-server

    - name: Enable and start hello-world-server service
      ansible.builtin.systemd:
        name: hello-world-server
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart hello-world-server
      ansible.builtin.systemd:
        name: hello-world-server
        state: restarted
